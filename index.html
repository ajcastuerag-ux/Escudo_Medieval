
<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Armería Medieval - Visor de Escudo 3D</title>

  <script type="module" src="https://ajax.googleapis.com/ajax/libs/model-viewer/3.4.0/model-viewer.min.js"></script>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@600;800&family=MedievalSharp&display=swap" rel="stylesheet">

  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      background: radial-gradient(circle at center, #2a1f1d 0%, #110c0b 100%);
      color: #e0d3c1;
      font-family: 'Cinzel', serif;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 20px;
    }

    header { text-align: center; margin-bottom: 20px; text-shadow: 2px 2px 8px #000; }

    header h1 {
      font-family: 'MedievalSharp', cursive;
      font-size: 2.8rem;
      color: #d4af37;
      letter-spacing: 2px;
      margin-bottom: 5px;
    }

    header p { font-size: 1rem; color: #a89f91; }

    .container {
      display: flex;
      flex-direction: row;
      flex-wrap: wrap;
      gap: 25px;
      max-width: 1200px;
      width: 100%;
      justify-content: center;
      align-items: stretch;
    }

    .viewer-card {
      flex: 1 1 500px;
      min-height: 500px;
      background: rgba(18, 12, 10, 0.85);
      border: 3px solid #8b6b32;
      border-radius: 12px;
      box-shadow: 0 10px 30px rgba(0,0,0,0.8), inset 0 0 15px rgba(212, 175, 55, 0.2);
      overflow: hidden;
      position: relative;
    }

    #escudoViewer {
      width: 100%;
      height: 100%;
      min-height: 500px;
      --poster-color: transparent;
    }

    /* Visor invisible que solo sirve para precargar */
    #precarga {
      position: absolute;
      width: 10px;
      height: 10px;
      opacity: 0;
      pointer-events: none;
    }

    #cargando {
      position: absolute;
      inset: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      background: rgba(18, 12, 10, 0.95);
      color: #a89f91;
      font-size: 1rem;
      letter-spacing: 2px;
      z-index: 5;
      transition: opacity 0.4s ease;
    }

    #cargando.oculto {
      opacity: 0;
      pointer-events: none;
    }

    .controls-card {
      flex: 0 1 340px;
      background: #1c1412;
      border: 2px solid #5c4322;
      border-radius: 12px;
      padding: 25px;
      display: flex;
      flex-direction: column;
      gap: 20px;
      box-shadow: 0 8px 25px rgba(0,0,0,0.7);
    }

    .controls-card h2 {
      font-family: 'MedievalSharp', cursive;
      color: #d4af37;
      font-size: 1.6rem;
      border-bottom: 1px solid #5c4322;
      padding-bottom: 10px;
      text-align: center;
    }

    .control-group { display: flex; flex-direction: column; gap: 8px; }

    .control-group label { font-size: 0.95rem; color: #c5b399; letter-spacing: 1px; }

    .btn-medieval {
      background: linear-gradient(180deg, #4a3525 0%, #2c1e14 100%);
      color: #f1e5d1;
      border: 1px solid #9a7b42;
      padding: 12px 15px;
      border-radius: 6px;
      font-family: 'Cinzel', serif;
      font-size: 0.9rem;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.2s ease-in-out;
      text-align: center;
      box-shadow: 0 4px 6px rgba(0,0,0,0.4);
    }

    .btn-medieval:hover {
      background: linear-gradient(180deg, #6e4f37 0%, #3d2b1d 100%);
      border-color: #d4af37;
      color: #fff;
      transform: translateY(-2px);
      box-shadow: 0 6px 12px rgba(212, 175, 55, 0.2);
    }

    .btn-medieval:active { transform: translateY(1px); }

    .status-box {
      margin-top: auto;
      padding: 10px;
      background: #120c0a;
      border: 1px dashed #5c4322;
      border-radius: 6px;
      font-size: 0.8rem;
      color: #8c7f70;
      text-align: center;
      word-break: break-all;
    }

    .status-box span { color: #d4af37; font-weight: bold; }

    @media (max-width: 768px) {
      .container { flex-direction: column; }
      .viewer-card { min-height: 380px; }
    }
  </style>
</head>
<body>

  <header>
    <h1>La Armería Real</h1>
    <p>Personalización e Inspección Interactiva de Escudo Medieval PBR</p>
  </header>

  <div class="container">
    <div class="viewer-card">
      <!-- UN SOLO visor real (su src se asigna cuando termina la precarga) -->
      <model-viewer
        id="escudoViewer"
        alt="Escudo Medieval 3D"
        auto-rotate
        camera-controls
        environment-image="neutral"
        exposure="0.75"
        shadow-intensity="0.2"
        shadow-softness="1"
        tone-mapping="neutral"
        ar>
      </model-viewer>

      <!-- Visor oculto que solo sirve para llenar la caché -->
      <model-viewer id="precarga" loading="eager" environment-image="neutral"></model-viewer>

      <div id="cargando">Cargando armería...</div>
    </div>

    <div class="controls-card">
      <h2>Opciones de Forja</h2>

      <div class="control-group">
        <label>1. Textura General</label>
        <button class="btn-medieval" onclick="cambiarModelo('textura')">
          Estado: <span id="txt-textura">Desgastado</span>
        </button>
      </div>

      <div class="control-group">
        <label>2. Acero del Escudo</label>
        <button class="btn-medieval" onclick="cambiarModelo('acero')">
          Tono: <span id="txt-acero">Color 1</span>
        </button>
      </div>

      <div class="control-group">
        <label>3. Grabado en Cuero</label>
        <button class="btn-medieval" onclick="cambiarModelo('grabado')">
          Diseño: <span id="txt-grabado">Grabado 1</span>
        </button>
      </div>

      <div class="control-group">
        <label>4. Relieve / Normal Map</label>
        <button class="btn-medieval" onclick="cambiarModelo('normal')">
          Estado: <span id="txt-normal">Activado</span>
        </button>
      </div>
    </div>
  </div>

  <script>
    const viewer = document.getElementById('escudoViewer');
    const precarga = document.getElementById('precarga');
    const cargando = document.getElementById('cargando');

    const rutas = [
      'modelos/desgastado.glb',
      'modelos/limpio.glb',
      'modelos/color1.glb',
      'modelos/color2.glb',
      'modelos/color3.glb',
      'modelos/grabado1.glb',
      'modelos/grabado2.glb',
      'modelos/Sin Normal Map.glb'
    ];

    // ---------- Precarga: llena la caché interna de model-viewer ----------
    function esperarCarga(mv) {
      return new Promise(resolve => {
        const fin = () => {
          mv.removeEventListener('load', fin);
          mv.removeEventListener('error', fin);
          resolve();
        };
        mv.addEventListener('load', fin);
        mv.addEventListener('error', fin);
      });
    }

    async function precargarTodo() {
      await customElements.whenDefined('model-viewer');

      // Que la caché guarde todos los modelos (por defecto son 10)
      const clase = customElements.get('model-viewer');
      clase.modelCacheSize = 12;

      for (const ruta of rutas) {
        const espera = esperarCarga(precarga);
        precarga.src = encodeURI(ruta);
        await espera;
      }

      // Ya están todos en caché: el visor real carga el primero al instante
      const espera = esperarCarga(viewer);
      viewer.src = encodeURI('modelos/desgastado.glb');
      await espera;

      cargando.classList.add('oculto');
      precarga.remove();
    }

    precargarTodo();

    // ---------- Cambio de modelo (mismo visor, el giro no se detiene) ----------
    function cargarGLB(ruta) {
      const nuevoSrc = encodeURI(ruta);
      if (viewer.getAttribute('src') === nuevoSrc) return;

      // Guarda el ángulo actual para que no salte al cambiar
      const o = viewer.getCameraOrbit();
      const orbit = `${o.theta}rad ${o.phi}rad ${o.radius}m`;

      viewer.addEventListener('load', () => {
        viewer.cameraOrbit = orbit;
      }, { once: true });

      viewer.src = nuevoSrc;
    }

    // ---------- Lógica de los botones ----------
    const estado = {
      textura: 'desgastado',
      acero: 'color1',
      grabado: 'grabado1',
      normal: 'activado'
    };

    function cambiarModelo(tipo) {
      if (tipo === 'textura') {
        estado.textura = estado.textura === 'desgastado' ? 'limpio' : 'desgastado';
        document.getElementById('txt-textura').innerText =
          estado.textura === 'desgastado' ? 'Desgastado' : 'Limpio';
        cargarGLB(`modelos/${estado.textura}.glb`);
      }
      else if (tipo === 'acero') {
        if (estado.acero === 'color1') estado.acero = 'color2';
        else if (estado.acero === 'color2') estado.acero = 'color3';
        else estado.acero = 'color1';

        const numeroColor = estado.acero.replace('color', '');
        document.getElementById('txt-acero').innerText = `Color ${numeroColor}`;
        cargarGLB(`modelos/${estado.acero}.glb`);
      }
      else if (tipo === 'grabado') {
        estado.grabado = estado.grabado === 'grabado1' ? 'grabado2' : 'grabado1';
        document.getElementById('txt-grabado').innerText =
          estado.grabado === 'grabado1' ? 'Grabado 1' : 'Grabado 2';
        cargarGLB(`modelos/${estado.grabado}.glb`);
      }
      else if (tipo === 'normal') {
        estado.normal = estado.normal === 'activado' ? 'desactivado' : 'activado';
        document.getElementById('txt-normal').innerText =
          estado.normal === 'activado' ? 'Activado' : 'Desactivado';

        const modeloRuta = estado.normal === 'desactivado'
          ? 'modelos/Sin Normal Map.glb'
          : 'modelos/desgastado.glb';
        cargarGLB(modeloRuta);
      }
    }
  </script>

</body>
</html>
