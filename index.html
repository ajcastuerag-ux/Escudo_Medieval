<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Armería Medieval - Visor de Escudo 3D</title>
  
  <!-- Carga del componente <model-viewer> de Google -->
  <script type="module" src="https://ajax.googleapis.com/ajax/libs/model-viewer/3.4.0/model-viewer.min.js"></script>
  
  <!-- Fuente estilo medieval/fantasía desde Google Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@600;800&family=MedievalSharp&display=swap" rel="stylesheet">

  <style>
    /* Reset básico */
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      background: radial-gradient(circle at center, #2a1f1d 0%, #110c0b 100%);
      color: #e0d3c1;
      font-family: 'Cinzel', serif;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 20px;
    }

    header {
      text-align: center;
      margin-bottom: 20px;
      text-shadow: 2px 2px 8px #000;
    }

    header h1 {
      font-family: 'MedievalSharp', cursive;
      font-size: 2.8rem;
      color: #d4af37;
      letter-spacing: 2px;
      margin-bottom: 5px;
    }

    header p {
      font-size: 1rem;
      color: #a89f91;
    }

    /* Contenedor Principal */
    .container {
      display: flex;
      flex-direction: row;
      flex-wrap: wrap;
      gap: 25px;
      max-width: 1200px;
      width: 100%;
      justify-content: center;
      align-items: stretch;
    }

    /* Estilos del Visor 3D */
    .viewer-card {
      flex: 1 1 500px;
      min-height: 500px;
      background: rgba(18, 12, 10, 0.85);
      border: 3px solid #8b6b32;
      border-radius: 12px;
      box-shadow: 0 10px 30px rgba(0,0,0,0.8), inset 0 0 15px rgba(212, 175, 55, 0.2);
      overflow: hidden;
      position: relative;
    }

    model-viewer {
      width: 100%;
      height: 100%;
      min-height: 500px;
      --poster-color: transparent;
    }

    /* Panel de Controles Medieval */
    .controls-card {
      flex: 0 1 340px;
      background: #1c1412;
      border: 2px solid #5c4322;
      border-radius: 12px;
      padding: 25px;
      display: flex;
      flex-direction: column;
      gap: 20px;
      box-shadow: 0 8px 25px rgba(0,0,0,0.7);
    }

    .controls-card h2 {
      font-family: 'MedievalSharp', cursive;
      color: #d4af37;
      font-size: 1.6rem;
      border-bottom: 1px solid #5c4322;
      padding-bottom: 10px;
      text-align: center;
    }

    .control-group {
      display: flex;
      flex-direction: column;
      gap: 8px;
    }

    .control-group label {
      font-size: 0.95rem;
      color: #c5b399;
      letter-spacing: 1px;
    }

    /* Botones temáticos */
    .btn-medieval {
      background: linear-gradient(180deg, #4a3525 0%, #2c1e14 100%);
      color: #f1e5d1;
      border: 1px solid #9a7b42;
      padding: 12px 15px;
      border-radius: 6px;
      font-family: 'Cinzel', serif;
      font-size: 0.9rem;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.2s ease-in-out;
      text-align: center;
      box-shadow: 0 4px 6px rgba(0,0,0,0.4);
    }

    .btn-medieval:hover {
      background: linear-gradient(180deg, #6e4f37 0%, #3d2b1d 100%);
      border-color: #d4af37;
      color: #fff;
      transform: translateY(-2px);
      box-shadow: 0 6px 12px rgba(212, 175, 55, 0.2);
    }

    .btn-medieval:active {
      transform: translateY(1px);
    }

    /* Responsivo para celulares */
    @media (max-width: 768px) {
      .container {
        flex-direction: column;
      }
      .viewer-card {
        min-height: 380px;
      }
    }
  </style>
</head>
<body>

  <header>
    <h1>La Armería Real</h1>
    <p>Personalización e Inspección Interactiva de Escudo Medieval PBR</p>
  </header>

  <div class="container">
    <!-- Visor 3D -->
    <div class="viewer-card">
      <model-viewer 
        id="escudoViewer"
        src="modelos/desgastado.glb"
        alt="Escudo Medieval 3D"
        auto-rotate
        camera-controls
        environment-image="neutral"
        exposure="0.75"
        shadow-intensity="0.2"
        shadow-softness="1"
        tone-mapping="neutral"
        ar>
      </model-viewer>
    </div>

    <!-- Panel de Botones Interactivos -->
    <div class="controls-card">
      <h2>Opciones de Forja</h2>

      <!-- Botón 1: Estado / Textura -->
      <div class="control-group">
        <label>1. Textura General</label>
        <button class="btn-medieval" onclick="cambiarModelo('textura')">
          Estado: <span id="txt-textura">Desgastado</span>
        </button>
      </div>

      <!-- Botón 2: Color Acero -->
      <div class="control-group">
        <label>2. Acero del Escudo</label>
        <button class="btn-medieval" onclick="cambiarModelo('acero')">
          Tono: <span id="txt-acero">Color 1</span>
        </button>
      </div>

      <!-- Botón 3: Grabado Cuero -->
      <div class="control-group">
        <label>3. Grabado en Cuero</label>
        <button class="btn-medieval" onclick="cambiarModelo('grabado')">
          Diseño: <span id="txt-grabado">Grabado 1</span>
        </button>
      </div>

      <!-- Botón 4: Normal Map -->
      <div class="control-group">
        <label>4. Relieve / Normal Map</label>
        <button class="btn-medieval" onclick="cambiarModelo('normal')">
          Estado: <span id="txt-normal">Activado</span>
        </button>
      </div>
    </div>
  </div>

  <script>
    const viewer = document.getElementById('escudoViewer');

    // Estado interno inicializado con 'desgastado'
    const estado = {
      textura: 'desgastado',
      acero: 'color1',
      grabado: 'grabado1',
      normal: 'activado'
    };

    function cambiarModelo(tipo) {
      if (tipo === 'textura') {
        estado.textura = estado.textura === 'desgastado' ? 'limpio' : 'desgastado';
        document.getElementById('txt-textura').innerText = estado.textura === 'desgastado' ? 'Desgastado' : 'Limpio';
        
        cargarGLB(`modelos/${estado.textura}.glb`);
      } 
      else if (tipo === 'acero') {
        if (estado.acero === 'color1') estado.acero = 'color2';
        else if (estado.acero === 'color2') estado.acero = 'color3';
        else estado.acero = 'color1';

        const numeroColor = estado.acero.replace('color', '');
        document.getElementById('txt-acero').innerText = `Color ${numeroColor}`;
        
        cargarGLB(`modelos/${estado.acero}.glb`);
      } 
      else if (tipo === 'grabado') {
        estado.grabado = estado.grabado === 'grabado1' ? 'grabado2' : 'grabado1';
        document.getElementById('txt-grabado').innerText = estado.grabado === 'grabado1' ? 'Grabado 1' : 'Grabado 2';
        
        cargarGLB(`modelos/${estado.grabado}.glb`);
      } 
      else if (tipo === 'normal') {
        estado.normal = estado.normal === 'activado' ? 'desactivado' : 'activado';
        document.getElementById('txt-normal').innerText = estado.normal === 'activado' ? 'Activado' : 'Desactivado';
        
        const modeloRuta = estado.normal === 'desactivado' ? 'modelos/Sin Normal Map.glb' : 'modelos/desgastado.glb';
        cargarGLB(modeloRuta);
      }
    }

    function cargarGLB(ruta) {
      viewer.src = ruta;
    }
  </script>

</body>
</html>
